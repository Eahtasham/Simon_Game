<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Game</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>
  <div class="game-container">
    <h1 id="level-title" class="animate__animated animate__pulse">Press Any Key to Start</h1>
    <div class="container">
      <div class="row">
        <div type="button" id="green" class="btn green animate__animated">
          <div class="btn-inner"></div>
        </div>
        <div type="button" id="red" class="btn red animate__animated">
          <div class="btn-inner"></div>
        </div>
      </div>

      <div class="row">
        <div type="button" id="yellow" class="btn yellow animate__animated">
          <div class="btn-inner"></div>
        </div>
        <div type="button" id="blue" class="btn blue animate__animated">
          <div class="btn-inner"></div>
        </div>
      </div>
    </div>
    
    <div class="controls">
      <button id="start-btn" class="control-btn">Start</button>
      <button id="restart-btn" class="control-btn">Restart</button>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="game.js" charset="utf-8"></script>
</body>

</html>
